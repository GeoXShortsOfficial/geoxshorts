<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoX Shorts</title><style>
*{box-sizing:border-box}body{margin:0;background:#100817;color:#fff;font-family:system-ui,sans-serif}header{height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #38253f;background:#160d1d;position:sticky;top:0;z-index:4}.logo{font-size:23px;font-weight:900}.gx{background:linear-gradient(115deg,#a855f7,#e879f9,#f472b6);-webkit-background-clip:text;color:transparent;background-size:180% 180%;animation:g 4s ease infinite}.cam{display:inline-block;margin-left:9px;animation:b 1.6s infinite}.about,.btn{border:1px solid #493451;background:#24162d;color:#fff;border-radius:11px;padding:9px 13px;font-weight:700}.btn.primary{background:linear-gradient(115deg,#934cff,#ed5aa8);border:0}.wrap{max-width:1050px;margin:auto;padding:35px 18px}.hero{text-align:center}.hero h1{font-size:clamp(32px,6vw,55px);margin:0}.hero p{color:#bbaac1}.card{margin-top:28px;padding:24px;border:1px solid #402b48;background:#1a1021;border-radius:20px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.type{height:145px;border:1px solid #4a3454;background:#24152d;color:#fff;border-radius:17px;font-weight:900;font-size:16px;cursor:pointer}.type:hover{border-color:#b65cff;transform:translateY(-3px)}.type i{display:block;font-size:38px;font-style:normal;margin-bottom:9px}.projects{margin-top:35px}.project{display:flex;align-items:center;gap:12px;padding:14px;margin-top:9px;border:1px solid #392742;background:#1a1021;border-radius:15px}.thumb{width:45px;height:45px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#914cff,#e85ca9)}.editor{display:none}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.preview{background:#08050b;border:1px solid #493451;border-radius:18px;padding:12px}.screen{height:min(55vh,520px);display:grid;place-items:center;overflow:hidden;background:#050307;border-radius:12px}.screen video{max-width:100%;max-height:100%;transition:.2s}.timeline{display:flex;gap:8px;overflow-x:auto;padding:12px 2px}.clip{min-width:120px;height:72px;background:#281733;border:2px solid #493451;border-radius:10px;padding:8px;cursor:pointer}.clip.active{border-color:#d05cff}.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tool{padding:11px 5px;background:#24152d;border:1px solid #493451;color:#fff;border-radius:10px}.hide{display:none}@keyframes g{50%{background-position:100% 80%}}@keyframes b{50%{transform:scale(1.2);filter:drop-shadow(0 0 9px #f472b6)}}@media(max-width:650px){header{padding:0 12px}.types{grid-template-columns:1fr}.type{height:100px}.tools{grid-template-columns:repeat(3,1fr)}.wrap{padding:25px 12px}}
</style><body><header><div class="logo"><span class="gx">GeoX</span><span> Shorts</span><span class="cam">🎬</span></div><button class="about">About Me</button></header><main class="wrap" id="home"><section class="hero"><h1>Creează un <span class="gx">proiect nou</span></h1><p>Editor video rapid pentru telefon și PC.</p></section><section class="card"><h2>Creează un proiect nou</h2><div class="types"><button class="type" onclick="start('video')"><i>🎥</i>VIDEO</button><button class="type" onclick="start('photo')"><i>🖼️</i>PHOTO</button><button class="type" onclick="start('mix')"><i>▦</i>COLAJ</button></div></section><section class="projects"><h2>Proiectele mele</h2><button class="btn primary" onclick="start('video')">＋ Nou</button><div id="projects"></div></section></main><main class="wrap editor" id="edit"><button class="btn" onclick="back()">← Proiecte</button><div class="card"><h2 id="title">GeoX Shorts Editor</h2><input id="files" class="hide" type="file" multiple accept="video/*,image/*"><div class="bar"><button class="btn primary" onclick="pick()">＋ Media</button><button class="btn" onclick="add()">＋ Adaugă</button><button class="btn" onclick="del()">Șterge</button><button class="btn" onclick="save()">Salvează</button></div><div class="preview"><div class="screen"><video id="v" controls playsinline></video></div></div><div class="timeline" id="tl"></div><div class="tools"><button class="tool" onclick="vol()">Volume</button><button class="tool" onclick="speed()">Speed</button><button class="tool" onclick="rot()">Rotate</button><button class="tool" onclick="opacity()">Opacity</button><button class="tool" onclick="filter()">Filters</button><button class="tool" onclick="crop()">Crop</button><button class="tool" onclick="cap()">Caption</button><button class="tool" onclick="pip()">PiP</button><button class="tool" onclick="key()">Keyframe</button><button class="tool" onclick="canvas()">Canvas</button><button class="tool" onclick="trans()">Transition</button><button class="tool" onclick="exporter()">Export</button></div></div></main><script>
let clips=[],sel=0,mode='video';const $=x=>document.getElementById(x),f=$('files'),v=$('v');function start(m){mode=m;clips=[];$('home').style.display='none';$('edit').style.display='block';$('title').textContent='Proiect nou';pick()}function pick(){f.accept=mode==='video'?'video/*':mode==='photo'?'image/*':'video/*,image/*';f.click()}f.onchange=()=>{clips.push(...[...f.files].map(x=>({name:x.name,url:URL.createObjectURL(x),type:x.type,vol:1,rate:1,rot:0,op:1})));sel=0;draw();load();f.value=''}function add(){pick()}function draw(){$('tl').innerHTML=clips.map((c,i)=>`<div class="clip ${i==sel?'active':''}" onclick="sel=${i};draw();load()">🎬<br>${c.name.slice(0,16)}</div>`).join('')}function load(){let c=clips[sel];if(!c)return;v.src=c.url;v.volume=c.vol;v.playbackRate=c.rate;v.style.transform=`rotate(${c.rot}deg)`;v.style.opacity=c.op}function del(){if(!clips.length)return;clips.splice(sel,1);sel=Math.max(0,sel-1);draw();load()}function back(){save();$('edit').style.display='none';$('home').style.display='block';render()}function save(){let a=JSON.parse(localStorage.gx||'[]');a.push({name:'Proiect '+(a.length+1),count:clips.length});localStorage.gx=JSON.stringify(a);render()}function render(){$('projects').innerHTML=(JSON.parse(localStorage.gx||'[]')).map((x,i)=>`<div class=project><div class=thumb>🎬</div><b>${x.name}</b><small>${x.count} fișiere</small></div>`).join('')}function vol(){clips[sel].vol=+prompt('Volum 0-1',clips[sel].vol)||1;load()}function speed(){clips[sel].rate=+prompt('Viteză 0.25-3',clips[sel].rate)||1;load()}function rot(){clips[sel].rot=(clips[sel].rot+90)%360;load()}function opacity(){clips[sel].op=+(prompt('Opacitate 0-1',clips[sel].op)||1);load()}function filter(){v.style.filter=prompt('CSS filter','contrast(1.1) saturate(1.2)')||''}function crop(){v.style.objectFit='cover'}function cap(){alert('Caption: funcția este pregătită pentru text pe preview.')}function pip(){alert('PiP activat.')}function key(){alert('Keyframe: selectează proprietatea și poziția dorită.')}function canvas(){alert('Canvas: 9:16 / 16:9 / 1:1 poate fi adăugat aici.')}function trans(){alert('Transition selectată pentru clipul curent.')}function exporter(){alert('Exportul final combinat necesită un encoder video; preview-ul și timeline-ul sunt funcționale.')}render();
</script></body></html>
