<!doctype html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoX Shorts</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#32134f,#120a1c 55%);color:#fff;font-family:Inter,system-ui,sans-serif}header{height:72px;border-bottom:1px solid #3b2948;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#160d21eF;backdrop-filter:blur(14px);z-index:5}.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.gx{background:linear-gradient(90deg,#9b4dff,#ff4fa3);background-size:200%;-webkit-background-clip:text;color:transparent;animation:g 3s linear infinite}.cam{display:inline-block;margin-left:8px;animation:p 1.5s infinite}.about{background:#251733;border:1px solid #49345a;color:#fff;padding:10px 15px;border-radius:12px;cursor:pointer}main{max-width:900px;margin:auto;padding:45px 20px}.hero{text-align:center}.hero h1{font-size:clamp(34px,7vw,62px);margin:0;font-weight:900}.hero p{color:#bcaec7;margin:12px auto 35px}.panel{background:#1b1027;border:1px solid #402c50;border-radius:22px;padding:25px;box-shadow:0 18px 60px #0005}.panel h2{text-align:center;margin:0 0 20px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.type{min-height:145px;background:#241633;border:1px solid #49335b;border-radius:18px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:800;transition:.2s}.type:hover{transform:translateY(-4px);border-color:#b55cff}.ico{font-size:38px}.projects{margin-top:38px}.project{display:flex;align-items:center;gap:14px;background:#1b1027;border:1px solid #3d294b;border-radius:16px;padding:15px;margin-top:10px}.thumb{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#8b42ff,#ff4f9c);display:grid;place-items:center}.info{flex:1}.info b{display:block}.info small{color:#a99aad}.new{border:0;background:linear-gradient(90deg,#9148ff,#f34d9b);color:#fff;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.box{width:min(560px,100%);background:#1b1027;border:1px solid #513563;border-radius:22px;padding:24px}.box h2{margin-top:0}.close{float:right;background:none;border:0;color:#fff;font-size:25px;cursor:pointer}.drop{border:2px dashed #5d4270;border-radius:16px;padding:25px;text-align:center;color:#bcaec7;margin:15px 0}.save{width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(90deg,#9148ff,#f34d9b);color:#fff;font-weight:900;cursor:pointer}.files{color:#d9cde0;font-size:13px}.hide{display:none}@keyframes g{to{background-position:200%}}@keyframes p{50%{transform:scale(1.18) rotate(5deg);filter:drop-shadow(0 0 8px #ff64ba)}}@media(max-width:600px){header{padding:0 15px}.about{padding:8px 10px}.types{grid-template-columns:1fr}.type{min-height:105px}.panel{padding:18px}main{padding:30px 14px}}
</style></head><body><header><div class="logo"><span class="gx">GeoX</span> <span>Shorts</span><span class="cam">🎬</span></div><button class="about">About Me</button></header><main><section class="hero"><h1>Creează un <span class="gx">proiect nou</span></h1><p>Editează videoclipuri și fotografii direct din telefon sau PC.</p></section><section class="panel"><h2>Creează un proiect nou</h2><div class="types"><button class="type" onclick="openM('video')"><span class="ico">🎥</span>VIDEO</button><button class="type" onclick="openM('photo')"><span class="ico">🖼️</span>PHOTO</button><button class="type" onclick="openM('collage')"><span class="ico">▦</span>COLAJ</button></div></section><section class="projects"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Proiectele mele</h2><button class="new" onclick="openM('video')">＋ Nou</button></div><div id="list"></div></section></main><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeM()">×</button><h2 id="mt">Proiect nou</h2><input id="name" placeholder="Numele proiectului" style="width:100%;padding:13px;border-radius:12px;border:1px solid #49335b;background:#241633;color:white"><div class="drop"><button class="new" onclick="pick()">Selectează fișiere</button><input id="files" class="hide" type="file" multiple><p id="desc">Poți selecta mai multe videoclipuri.</p><div id="chosen" class="files"></div></div><button class="save" onclick="save()">Salvează proiectul</button></div></div><script>
let kind="video",chosen=[];const modal=document.getElementById("modal"),files=document.getElementById("files");function openM(k){kind=k;chosen=[];document.getElementById("name").value="";document.getElementById("chosen").textContent="";document.getElementById("mt").textContent=k==="video"?"Proiect video":k==="photo"?"Proiect foto":"Proiect colaj";document.getElementById("desc").textContent=k==="video"?"Selectează mai multe videoclipuri.":k==="photo"?"Selectează mai multe poze.":"Selectează videoclipuri și poze.";files.accept=k==="video"?"video/*":k==="photo"?"image/*":"video/*,image/*";modal.style.display="flex"}function closeM(){modal.style.display="none"}function pick(){files.click()}files.onchange=()=>{chosen=[...files.files];document.getElementById("chosen").textContent=chosen.length+" fișier(e) selectate"}function save(){if(!chosen.length){alert("Selectează cel puțin un fișier.");return}let a=JSON.parse(localStorage.getItem("gxprojects")||"[]"),name=document.getElementById("name").value.trim()||"Proiect "+(a.length+1);a.push({name,kind,count:chosen.length,date:new Date().toLocaleDateString("ro-RO")});localStorage.setItem("gxprojects",JSON.stringify(a));closeM();render()}function render(){let a=JSON.parse(localStorage.getItem("gxprojects")||"[]");document.getElementById("list").innerHTML=a.length?a.map((x,i)=>`<div class="project"><div class="thumb">${x.kind==="video"?"🎥":x.kind==="photo"?"🖼️":"▦"}</div><div class="info"><b>${x.name}</b><small>${x.kind} · ${x.count} fișier(e) · ${x.date}</small></div></div>`).join(""):'<div class="panel" style="text-align:center;color:#a99aad">Nu ai încă proiecte. Creează primul proiect.</div>'}render();
</script></body></html>
